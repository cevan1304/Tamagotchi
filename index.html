 let mouth=['sad','dead'].includes(mood)?'M71 124 Q80 113 89 124':'M71 118 Q80 128 89 118';

 return `<svg viewBox="0 0 160 170" role="img" aria-label="${p.name}"><g transform="${stage===1?'translate(20,34) scale(.75)':stage===2?'translate(8,14) scale(.9)':''}">${extras}${ear(56,146,17,9)}${ear(105,146,17,9)}${body}${p.kind==='penguin'?'<ellipse cx="80" cy="114" rx="32" ry="31" fill="#f6f1e5"/>':''}<ellipse cx="80" cy="131" rx="22" ry="13" fill="#ffffff28"/>${eyes}<ellipse cx="46" cy="113" rx="9" ry="5" fill="#ff879a77"/><ellipse cx="114" cy="113" rx="9" ry="5" fill="#ff879a77"/>${p.kind==='bird'?'<path d="M71 114 L80 126 L89 114Z" fill="#ec9e4d"/>':`<path class="mouth" d="${mouth}" fill="none" stroke="#374058" stroke-width="3" stroke-linecap="round"/>`}${mood==='sad'?'<path d="M112 105 Q125 122 114 125 Q103 123 112 105" fill="#77bde9"/>':''}${award}${typeof activity!=='undefined'&&activity?.kind==='brush'?toothbrushSVG():''}</g></svg>`;

function clearActivity(){clearTimeout(activityTimer);activity=null;$('room').removeAttribute('data-activity');$('fx').innerHTML='';petSignature=''}
function playActivity(kind,extra={}){
 clearActivity();if(!state)return;
 const duration={brush:3000,hatch:2300,grow:2600,farewell:2600}[kind]||2100;
 activity={kind,until:Date.now()+duration};activitySound(kind);$('room').dataset.activity=kind;
 const particles=(symbols,count=9)=>Array.from({length:count},(_,i)=>`<span class="fxitem" style="--x:${22+(i*19)%62}%;--y:${55+(i*7)%22}%;--delay:${i*.085}s;--size:${17+i%3*6}px">${symbols[i%symbols.length]}</span>`).join('');
 const labels={brush:'Čisté zúbky, krásny úsmev!',feed:'Mňam, mňam!',candy:'Sladká radosť!',overfeed:'Au, moje bruško…',clean:'Čisto a voňavo!',medicine:'Už je mi lepšie.',shot:'Pich! A teraz oddych.',sleep:restGreeting(),wake:wakeGreeting(),hatch:'Ahoj, svet!',grow:'Rastiem s tebou!',celebrate:'To bola zábava!',light:'Dobré svetlo!',dark:'Sladké sny…',farewell:'Navždy v spomienkach ♡'};
 let content=`<div class="fxlabel">${labels[kind]||''}</div>`;
 if(kind==='feed'||kind==='candy')content+=`<span class="fxprop">${extra.icon||(kind==='candy'?'🍬':isInfant()?'🍼':'🥣')}</span>`+particles(kind==='candy'?['♡','✦','🍬']:['✦','♡'],6);
 if(kind==='overfeed')content+=`<span class="fxprop">${extra.icon||(isInfant()?'🍼':'🥣')}</span>`+particles(['💧'],4);
 if(kind==='clean')content+=Array.from({length:extra.poops||0},(_,i)=>`<span class="fxmess" style="--x:${12+i*15}%">💩</span>`).join('')+'<span class="fxprop broom">🧹</span>'+particles(['🫧','✧'],10);
 if(kind==='medicine'||kind==='shot')content+=`<span class="fxprop medicine">${kind==='shot'?'💉':'💊'}</span>`+particles(['✚','♡','✨']);
 if(kind==='sleep'||kind==='dark')content+=particles(['z','Z','✧'],5);
 if(kind==='wake'||kind==='light')content+=particles(['☀','✧'],7);
 if(kind==='hatch')content+='<i class="fxshard"></i><i class="fxshard right"></i><div class="fxring"></div>'+particles(['✦','♡','✨'],12);
 if(kind==='grow'||kind==='celebrate')content+='<div class="fxring"></div>'+particles(['✦','♡','✨'],12);
 if(kind==='farewell')content+=particles(['♡','✧'],7);
 $('fx').innerHTML=content;render();
 activityTimer=setTimeout(()=>{if(activity&&activity.kind===kind){clearActivity();render()}},duration);
}
function drawPet(){
 let mood=state.dead?'dead':state.sleeping?'sleep':state.sick||state.happy<30?'sad':'happy';
 if(activity&&!state.dead&&!state.sleeping){if(activity.kind==='overfeed'||activity.kind==='shot')mood='sad';else if(['feed','candy','clean','brush','medicine','celebrate','hatch','grow'].includes(activity.kind))mood='happy'}
 const signature=[state.species,state.stage,mood,state.variant,state.sleeping,state.dead,activity?.kind==='brush'].join('|');
 if(signature!==petSignature){petSignature=signature;$('pet').className='pet '+(state.stage===0?'egg':state.sleeping?'sleep':state.dead?'dead':'');$('pet').innerHTML=state.stage===0?eggSVG():svgPet(state.species,state.stage,mood,state.variant)}
 const sleepKey=state.sleeping&&!state.dead&&state.stage>0?'sleep':'';
 if(sleepKey!==sleepSignature){sleepSignature=sleepKey;$('sleepfx').innerHTML=sleepKey?'<span class="fxsleep">z</span><span class="fxsleep">Z</span><span class="fxsleep">z</span>':''}
}
function save(){if(!state)return;try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false}$('saved').textContent=storageOK?'ULOŽENÉ V TOMTO PREHLIADAČI':'UKLADANIE NIE JE DOSTUPNÉ';$('saved').classList.toggle('storage',!storageOK)}
function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&s.version===1&&Number.isInteger(s.species)&&s.species>=0&&s.species<10&&['born','last','food','happy','energy','health','coins','careTotal','careTime','critical','poopClock','poops','stage'].every(k=>Number.isFinite(s[k]))){s.name=String(s.name).slice(0,16);state=s}}catch(e){storageOK=false}}
function toast(text){$('toast').textContent=text;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2600)}
function escapeText(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function open(title,content){stopGame();modal=title;$('overlay').classList.remove('hidden');$('overlay').innerHTML=`<div class="toprow"><h2>${title}</h2><button class="close" id="close" aria-label="Zavrieť">×</button></div>${content}`;$('close').onclick=close}
function close(){stopGame();modal='';$('overlay').classList.add('hidden');render()}
function picker(){careMood='content';carePending=null;$('mainclock').classList.add('hidden');clearActivity();sleepSignature='';$('sleepfx').innerHTML='';stopGame();modal='pick';$('overlay').classList.remove('hidden');$('overlay').innerHTML=`<div class="eyebrow">TVOJ NOVÝ MALÝ VESMÍR</div><h1>Kto bude tvoj kamarát?</h1><p>Desať miláčikov. Každý začína vo vajíčku — jeho budúcnosť je vo tvojich rukách.</p><div class="gridpets">${species.map((p,i)=>`<button class="choice ${i===selected?'selected':''}" data-pick="${i}" aria-pressed="${i===selected}">${svgPet(i)}${p.name}</button>`).join('')}</div><p id="description">${species[selected].desc}</p><input id="newname" aria-label="Meno miláčika" maxlength="16" placeholder="Meno miláčika" value="${species[selected].name}"><button class="primary" id="start">Adoptovať vajíčko ✧</button>`;document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{selected=+b.dataset.pick;document.querySelectorAll('[data-pick]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',x===b)});$('newname').value=species[selected].name;$('description').textContent=species[selected].desc});$('start').onclick=()=>{let now=Date.now();state={version:1,species:selected,name:$('newname').value.trim()||species[selected].name,born:now,last:now,stage:0,food:75,happy:75,energy:85,health:100,coins:40,poops:0,poopClock:0,sleeping:false,lights:true,dead:false,sick:false,critical:0,careTotal:0,careTime:0,variant:'balanced',nextPlay:0,lastMedicine:0,log:['Adopcia nového vajíčka.']};save();close()}}
function log(text){state.log.unshift(text);state.log=state.log.slice(0,8)}
function evolve(now){let age=now-state.born,target=age<45000?0:age<DAY?1:age<3*DAY?2:3;if(target>state.stage){let before=state.stage;state.stage=target;if(target===3){const quality=state.careTime?state.careTotal/state.careTime:75;state.variant=quality>=75?'radiant':quality>=45?'balanced':'wild';log('Dospelosť: '+variantName()+'.')}else log(target===1?'Vajíčko sa vyliahlo!':'Miláčik vyrástol na dieťa.');playActivity(before===0?'hatch':'grow');if(before===0)toast('Ahoj, svet! Tvoj miláčik sa vyliahol.');else toast('Tvoj miláčik vyrástol!')}}
function variantName(){return {radiant:'Žiarivá podoba',balanced:'Hravá podoba',wild:'Divoká podoba'}[state.variant]}
// Simulácia po päťminútových krokoch prebieha aj pri návrate po zatvorení stránky.
function advance(now=Date.now()){
 if(!state||state.dead)return;let cursor=state.last;if(now<=cursor)return;
 // Po 7 zanedbaných dňoch sa život skončí dávno pred koncom intervalu.
 let end=Math.min(now,cursor+7*DAY);
 while(cursor<end&&!state.dead){let dt=Math.min(300000,end-cursor),mid=cursor+dt/2,h=dt/3600000;const awakeAge=mid-state.born;if(awakeAge<45000){cursor+=dt;continue}
 let night=new Date(mid).getHours()>=21||new Date(mid).getHours()<7;
 state.food=clamp(state.food-h*(state.sleeping?2:4));state.happy=clamp(state.happy-h*(state.sleeping?1:3));state.energy=clamp(state.energy+h*(state.sleeping?(state.lights?2:10):-3.5));
 if(night&&!state.sleeping){state.energy=clamp(state.energy-h*2);state.happy=clamp(state.happy-h*2)}
 if(state.sleeping&&state.lights)state.happy=clamp(state.happy-h*2);
 state.poopClock+=h;if(state.poopClock+1e-9>=12){let n=Math.floor((state.poopClock+1e-9)/12);state.poops=Math.min(5,state.poops+n);state.poopClock=Math.max(0,state.poopClock-n*12)}
 if(state.food<20||state.poops>=2)state.sick=true;
 let risk=(state.food<20?4:0)+(state.energy<15?2:0)+(state.poops?state.poops*1.3:0)+(state.sick?2:0);
 state.health=clamp(state.health+h*(risk?-risk:(state.food>40&&state.energy>30?1.5:0)));
 let quality=(state.food+state.happy+state.energy+state.health)/4-state.poops*4;state.careTotal+=clamp(quality)*h;state.careTime+=h;
 state.critical=state.health<=5?state.critical+h:0;
 if(state.critical>=8){state.dead=true;state.diedAt=cursor+dt;log('Miláčik odišiel po dlhom kritickom stave.')}cursor+=dt;
 }
 state.last=now;if(!state.dead)evolve(now);
}
function render(){if(!state){$('stats').innerHTML='';return}const age=Date.now()-state.born,night=new Date().getHours()>=21||new Date().getHours()<7;let mood=state.dead?'dead':state.sleeping?'sleep':state.sick||state.happy<30?'sad':'happy';$('petname').textContent=state.name;$('coins').textContent=state.coins;$('foodicon').textContent=isInfant()?'🍼':'🥣';$('foodlabel').textContent=isInfant()?'Fľaša':'Jedlo';$('age').textContent=`${ageText()} · ${species[state.species].desc}`;updateClock();$('stage').textContent=state.dead?'♡ SPOMIENKA':['✧ VAJÍČKO','✦ BÁBÄTKO','✦ DIEŤA','♛ DOSPELÝ'][state.stage];drawPet();$('room').classList.toggle('night',!state.lights);$('orb').style.background=night?'#eff5ff':'#fff7c7';$('poops').innerHTML=Array(state.poops).fill('<span>💩</span>').join('');$('thought').textContent=state.dead?'':state.stage===0?'✧':state.sick?'☠️':state.sleeping?'💤':state.food<30?(isInfant()?'🍼':'🥣'):state.energy<30?'🥱':state.happy<30?'💧':'♡';$('aura').className=state.stage===3&&state.variant==='radiant'?'glow':'';
 let text=state.dead?'Ďakujem za spoločné chvíle. Nový kamarát čaká v denníku.':state.stage===0?`Vyliahnem sa za ${Math.max(0,Math.ceil((45000-age)/1000))} s. Zostaň pri mne!`:state.sleeping?(state.lights?'Zhasni mi, prosím. Pri svetle sa mi zle spí.':'Pšššt… naberám sily.'):state.sick?'Necítim sa dobre. Potrebujem liek a čistú izbičku.':state.poops?'Upraceš mi izbičku? Potrebujem to 2× denne.':state.food<30?'V brušku mi škvŕka. Dáme si niečo?':state.energy<30?'Som unavený. Potrebujem si oddýchnuť.':night?'Už je noc. Uspíš ma a zhasneš?':state.happy<30?'Je mi smutno. Zahráme sa spolu?':'Som rád, že si tu. Čo dnes spolu zažijeme?';$('speech').textContent=text;
 $('stats').innerHTML=[['food','Sýtosť','#ffca84'],['happy','Radosť','#e8a2d8'],['energy','Energia','#95bfff'],['health','Zdravie','#8ee3c0']].map(([k,n,c])=>`<div class="stat"><label>${n}<span>${Math.round(state[k])}</span></label><div class="track"><div class="fill" style="width:${state[k]}%;--c:${state[k]<20?'#ff838e':c}"></div></div></div>`).join('');document.querySelectorAll('[data-action]').forEach(b=>b.disabled=state.dead&&b.dataset.action!=='info');updateCareSounds();}
function ready(){advance();render();if(!state)return false;if(activity){toast('Počkaj chvíľku, miláčik ešte dokončuje činnosť.');return false}if(state.dead){toast('Otvor denník a adoptuj nového kamaráta.');return false}if(state.stage===0){toast('Najprv počkaj, kým sa vajíčko vyliahne.');return false}if(state.sleeping){toast('Miláčik spí. Najprv ho zobuď.');return false}return true}

function feed(choice){if(!ready()){close();return}const key=choice===true?'candy':choice===false?'dry':choice,candy=key==='candy';if(isInfant()&&key!=='dry'){toast('Do 1 roka je povolené iba mlieko z fľaše.');return}const m=mealCatalog[key];if(!m)return;if(state.coins<m.cost){toast('Potrebuješ '+m.cost+' GP. Zarobíš ich v mini-hre.');return}state.coins-=m.cost;state.happy=clamp(state.happy+m.happy);state.energy=clamp(state.energy+m.energy);if(candy)state.health=clamp(state.health-3);const over=state.food>=(candy?95:85);state.food=clamp(state.food+m.food);if(over){state.health=clamp(state.health-12);state.sick=true;log('Prejedanie — bruško potrebuje oddych.')}save();close();playActivity(over?'overfeed':candy?'candy':'feed',{icon:isInfant()?'🍼':m.icon});toast(over?'Priveľa jedla! Miláčika bolí bruško.':isInfant()?'Mliečko vypité! Bruško je spokojnejšie.':candy?'Sladká radosť!':m.name+' chutí! Bruško je spokojnejšie.')}

function isFullscreen(){return Boolean(document.fullscreenElement||document.webkitFullscreenElement)}
function syncFullscreen(){const active=isFullscreen(),button=$('fullscreen');button.textContent=active?'⛶ Zmenšiť':'⛶ Fullscreen';button.setAttribute('aria-pressed',String(active));button.setAttribute('aria-label',active?'Ukončiť celú obrazovku':'Zapnúť celú obrazovku')}
async function toggleFullscreen(){
 const root=document.documentElement;try{
 if(isFullscreen()){const exit=document.exitFullscreen||document.webkitExitFullscreen;if(exit)await exit.call(document)}
 else{const request=root.requestFullscreen||root.webkitRequestFullscreen;if(!request){toast('Tento prehliadač nepodporuje Fullscreen pre HTML hry.');return}await request.call(root)}
 syncFullscreen();
 }catch(error){syncFullscreen();toast('Prehliadač nepovolil celú obrazovku. Otvor hru priamo v prehliadači.')}
}
$('fullscreen').onclick=toggleFullscreen;document.addEventListener('fullscreenchange',syncFullscreen);document.addEventListener('webkitfullscreenchange',syncFullscreen);
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>({food:foodMenu,games,clean,medicine,sleep:sleepMenu,info}[b.dataset.action])());$('help').onclick=help;
function protectControls(event){
 const target=event.target instanceof Element?event.target:event.target?.parentElement;
 if(!target||!target.closest('#app'))return;
 if(target.closest('input,textarea,[contenteditable]:not([contenteditable="false"])'))return;
 event.preventDefault();
}
// Delegovanie chráni aj tlačidlá vložené po otvorení menu alebo mini-hry.
for(const type of ['selectstart','contextmenu','dragstart'])document.addEventListener(type,protectControls,{capture:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden){hushAudio();if(audioContext)audioContext.suspend().catch(()=>{});advance();save();clearActivity();if(game)close()}else{advance();save();render()}});window.addEventListener('pagehide',()=>{advance();save()});
if(typeof ResizeObserver!=='undefined'){new ResizeObserver(([entry])=>{document.querySelector('.display').style.setProperty('--message-height',entry.target.offsetHeight+'px')}).observe($('messages'))}
load();if(state){advance();save();render()}else picker();setInterval(()=>{if(!state)return;advance();render();save();if(game&&(state.dead||state.sick||state.sleeping)){close();toast('Miláčik teraz potrebuje starostlivosť.')}},1000);
